name: Release MediaGrab

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package macOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Package MediaGrab (.app, .dmg, .zip)
        run: |
          chmod +x scripts/package_app.sh
          ./scripts/package_app.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: MediaGrab ${{ github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
